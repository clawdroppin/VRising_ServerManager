[package]
name = "vrising-server-manager"
version = "1.0.0"
description = "V Rising dedicated server manager"
license = "MIT"
authors = ["clawdroppin"]
repository = "https://github.com/clawdroppin/VRising_ServerManager"
edition = "2021"

[lib]
name = "vrsm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "stream", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "network", "disk"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
uuid = { version = "1.27.0", features = ["v4"] }
walkdir = "2.5.0"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
zip = { version = "9.0.0", default-features = false, features = ["deflate-flate2-zlib-rs", "time"] }
futures-util = "0.3.34"
igd-next = { version = "0.16", default-features = false, features = ["aio_tokio"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography"] }
